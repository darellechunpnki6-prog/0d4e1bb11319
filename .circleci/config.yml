      - run:
          name: Render copper moth
          command: LIONSS_LP=1 ./build/copper-moth --config moth.cfg --iridescence 0.8
  LorawanAdr:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
